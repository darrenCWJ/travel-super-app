# The repo's checks, run on every push and pull request.
#
# One workflow that always runs (spec §0). Each job is gated by `if:` on the
# path filter below, so a job with nothing to check is skipped. A skipped job
# counts as success, whereas a workflow skipped by `paths:` would leave a
# required check pending forever. EAS never runs here.
#
# Every --filter carries --fail-if-no-match. pnpm exits 0 when a filter selects
# no package ("No projects matched the filters"), so without the flag a rename
# or a typo would turn a step that names its package into a silent no-op. On
# the `tools` job's excluding filters the flag is inert: it is there so the
# rule has no exception to remember.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v5
      # This and pnpm/action-setup are the two actions that are not GitHub's
      # own. Both are pinned to a commit: a tag can be moved, a commit cannot.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A path in no group runs no job, and ci-ok stays green, so a new
          # top-level code directory or a new app needs a line here.
          # reference/ (a layer in tools/boundaries/src/zones.ts, created by the
          # spec's §12 item 4) is listed from the start so that its first pull
          # request is checked.
          filters: |
            shared:
              - 'features/**'
              - 'platform/**'
              - 'reference/**'
              - 'tools/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
            mobile:
              - 'apps/mobile/**'

  # The boundary scan reads both apps and every package, so any code change runs it.
  tools:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Takes the pnpm version from the root package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every workspace package except the two apps, which are excluded by
      # name: the two tools today, and features/ and platform/ from the moment
      # they define a `typecheck` or a `test` script. Excluding instead of
      # naming means a new package joins the gate by defining a script, and
      # renaming one cannot drop it. A new or renamed app would be swept in
      # here too: give it its own job and exclude it by name.
      - run: pnpm --filter "!@tsa/web" --filter "!@tsa/mobile" --fail-if-no-match typecheck
      - run: pnpm --filter "!@tsa/web" --filter "!@tsa/mobile" --fail-if-no-match test
      # The repo's own guards, by name. They ran a moment ago in the sweep
      # above, but the sweep runs whatever `test` script each package it finds
      # defines: if @tsa/boundaries lost that script or left the workspace,
      # the other tool's tests would keep the sweep green with these never
      # run. This step calls Vitest itself, so it needs no script, and it
      # names the package, so it fails when the package is gone.
      - run: pnpm --filter @tsa/boundaries --fail-if-no-match exec vitest run src/repo.test.ts src/ci.test.ts src/lockfile.test.ts

  web:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tsa/web --fail-if-no-match typecheck
      - run: pnpm --filter @tsa/web --fail-if-no-match test
      # The `server-only` guard on apps/web/lib/server/airports.ts, cityIndex.ts,
      # catalog.ts and cityEnrichment.ts is only guaranteed to fire in a
      # production build: it is what turns a client import of a multi-megabyte
      # artifact, or of a Wikidata call whose User-Agent Chromium would drop,
      # into a build error instead of a silent shipment. Nothing else in CI
      # runs `next build` — `tsc` and vitest cannot see the boundary, and the
      # e2e job runs `next dev`, which compiles a page only when a test visits
      # it — so without this step the guard's only reliable trigger would be
      # Vercel's preview check, which is not required. Verified negatively on
      # 2026-09-06: a client import of lib/server/catalog fails this command
      # with the full import trace; so, on 2026-09-24, did one of
      # lib/server/cityEnrichment. Measured at 8-19 s locally.
      - run: pnpm --filter @tsa/web --fail-if-no-match build

  # A separate job from `web`, deliberately: a browser download and a Next
  # build are minutes of work that the unit gate should not wait behind, and a
  # flaky browser must not be able to redden the suite that has never been
  # flaky on CI.
  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pnpm store cache does not cover ~/.cache/ms-playwright, so without
      # this every run re-downloads the browser. Keyed on the resolved
      # Playwright version rather than on the lockfile hash, because that is
      # what decides which browser build is wanted. Run from apps/web because
      # node resolves @playwright/test from the working directory, and it is
      # that package's dependency.
      - name: Resolve Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Playwright is a devDependency of @tsa/web, so its bin does not resolve at
      # the workspace root: both commands reach it through --filter ... exec.
      # `--with-deps` pulls the system libraries the browser needs on
      # ubuntu-latest. Still run on a cache hit, because the cache restores the
      # browser binaries and not the apt packages beside them.
      - run: pnpm --filter @tsa/web --fail-if-no-match exec playwright install --with-deps chromium
      - run: pnpm --filter @tsa/web --fail-if-no-match exec playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tsa/mobile --fail-if-no-match typecheck
      # Compares the installed versions with what this Expo SDK expects. It asks
      # Expo's API, so this step needs the network. It reads only the app's
      # direct dependencies: a native module that arrives as another package's
      # peer is invisible to it (see packageExtensions in pnpm-workspace.yaml).
      - run: pnpm --filter @tsa/mobile --fail-if-no-match exec expo install --check
      # No --ci flag: Jest turns CI mode on by itself when the CI variable is
      # set, which GitHub Actions does.
      - run: pnpm --filter @tsa/mobile --fail-if-no-match test
      # Bundles the JavaScript for both platforms without a native build: proves
      # Metro resolves the workspace packages and the generated registry.
      - run: pnpm --filter @tsa/mobile --fail-if-no-match export

  # The one check to require: green only when every job above passed or was
  # skipped by the path filter. Requiring it on `main` would stop the refresh
  # workflows as they are: they push data commits straight to `main` with the
  # default token, GitHub starts no workflow run for a push or a pull request
  # made with that token, and a commit without this check would be refused.
  # They would first need an identity that may bypass the rule, or one whose
  # pull requests do start CI.
  ci-ok:
    needs: [changes, tools, web, e2e, mobile]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: A job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "Every job passed or was skipped."
