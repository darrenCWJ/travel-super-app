# pnpm 10 reads every setting from this file; .npmrc is only for registry auth.

packages:
  - apps/*
  - features
  - platform
  - tools/*

# Versions set once for the whole workspace. A package asks for one with
# "name": "catalog:". react, react-dom and react-native are the Expo SDK's exact
# pins (its bundledNativeModules.json): one React for the whole workspace.
catalog:
  "@types/node": ^26.2.0
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  typescript: ^7.0.2
  vitest: ^4.1.11

# expo-router depends on react-native-drawer-layout for its Drawer navigator,
# and that package's two native peers are required. pnpm would install the
# newest of each instead of the versions this Expo SDK expects, and Expo's
# autolinking would compile them, with react-native-worklets, into the Android
# build, where `expo install --check` cannot see them. The skeleton has no
# drawer, so the peers are optional here. When the shell needs gestures or
# Reanimated (phase 3), add both with `expo install`. Remove this block only
# once both are direct dependencies of the mobile app: with one missing, pnpm
# installs the newest of it again.
packageExtensions:
  react-native-drawer-layout:
    peerDependenciesMeta:
      react-native-gesture-handler:
        optional: true
      react-native-reanimated:
        optional: true

# One react-dom for the whole workspace, including the copy pnpm installs on its
# own for a package's peer: without this the mobile app's graph gets the newest
# react-dom beside the catalog's react. The cost: pnpm rewrites every package's
# react-dom peer range to this pin, so it no longer warns when a package wants
# a different react-dom. react has no entry, so its peer warnings still fire;
# it needs none while every package that depends on it says "catalog:".
overrides:
  react-dom: "catalog:"

# Dependency install scripts stay OFF unless a package is listed `true` here.
# better-sqlite3 ships prebuilt binaries (prebuilds/win32-x64.node, linux-x64)
# and this machine has no C++ toolchain, so the `node-gyp rebuild` npm used to
# infer for it must never run. `false` records that decision and silences the
# "ignored build scripts" warning.
allowBuilds:
  better-sqlite3: false
